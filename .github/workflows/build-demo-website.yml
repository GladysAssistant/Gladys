name: Build and publish demo website

on:
  # Started by the push of the release tag (the "Create release tag" workflow
  # pushes it with a deploy key, so the `push` event below does fire).
  # workflow_dispatch stays for re-running a failed build on an existing tag.
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The deployment secrets live in the `production` environment, which only
    # jobs running on master or on a v* tag can read (see .github/MAINTAINERS.md).
    environment: production
    name: Build and publish demo website
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 💽 Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: 'front/package.json'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: 📦 Install NPM front packages
        working-directory: ./front
        run: |
          npm ci
      - name: 🏗️ Build front
        working-directory: ./front
        env:
          DEMO_MODE: true
        run: |
          npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PUBLISH_TO_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.162.0'
          command: pages deploy ./front/build --project-name=gladysassistant-demo --branch=main
