name: Build and publish demo website

on:
  # Dispatched on the new tag by the "Create release tag" workflow: a tag pushed
  # with the default GITHUB_TOKEN does not trigger the `push` event below.
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'
    # The demo is a showcase: it follows master so it never lags behind the
    # features presented on the website, instead of only being refreshed on
    # release day.
    branches:
      - master

# One deploy at a time: several pushes in a row must not race on Cloudflare
# Pages. A running deploy is never cancelled, only the queued ones it made
# obsolete.
concurrency:
  group: demo-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and publish demo website
    steps:
      - uses: actions/checkout@v3
      - name: 💽 Setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version-file: 'front/package.json'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: 📦 Install NPM front packages
        working-directory: ./front
        run: |
          npm ci
      - name: 🏗️ Build front
        working-directory: ./front
        env:
          DEMO_MODE: true
        run: |
          npm run build
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PUBLISH_TO_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gladysassistant-demo
          directory: ./front/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
