name: Trigger Cursor automation

# Starts a Cursor Automation webhook for a given PR, either:
# - automatically when a PR is opened (or marked "ready for review"),
# - when anyone allowed to do so comments "/cursor review" on the PR,
# - when the label "needs:cursor-review" is added to a PR, or
# - manually via workflow_dispatch.
#
# Useful for fork PRs, which native Cursor PR triggers cannot run on.
#
# Required repository secrets:
#   CURSOR_AUTOMATION_WEBHOOK_URL   - full webhook URL from the automation page
#                                     (https://api2.cursor.sh/automations/webhook/<id>)
#   CURSOR_AUTOMATION_WEBHOOK_TOKEN - API key from "Generate auth header"
#                                     (crsr_... value only, without "Bearer ")
#
# SECURITY: use pull_request_target / issue_comment so secrets work for fork
# PRs. This workflow must NEVER check out or execute code from the PR head. It
# only reads PR metadata through the GitHub API, then POSTs to Cursor. The
# comment body is untrusted input: it only ever transits through shell
# variables, never interpolated into code.
on:
  # Secrets are available for fork PRs with pull_request_target.
  pull_request_target:
    types: [opened, ready_for_review, labeled]
  # Comment command. issue_comment always runs from the base branch with
  # secrets available, including for comments on fork PRs.
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to pass to the Cursor automation
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  # Needed to react to the triggering comment (PR comments are issue comments).
  issues: write

jobs:
  trigger:
    # Coarse filter so a runner is not started for every single comment. The
    # exact command match and the permission check happen in "Resolve trigger".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
        (github.event.action != 'labeled' ||
         github.event.label.name == 'needs:cursor-review')) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/cursor'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve trigger
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_PR_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -uo pipefail

          RUN=false
          REASON=''
          PR_NUMBER=''

          react() {
            gh api --silent -X POST \
              "repos/${GH_REPO}/issues/comments/${COMMENT_ID}/reactions" \
              -f "content=$1" || echo "::warning::Could not react to comment ${COMMENT_ID}"
          }

          case "$EVENT_NAME" in
            workflow_dispatch)
              PR_NUMBER="$INPUT_PR"
              REASON='manual'
              RUN=true
              ;;

            pull_request_target)
              PR_NUMBER="$EVENT_PR"
              case "$EVENT_ACTION" in
                labeled)
                  REASON='label'
                  RUN=true
                  ;;
                ready_for_review)
                  REASON='pr_ready_for_review'
                  RUN=true
                  ;;
                opened)
                  if [ "$EVENT_PR_DRAFT" = 'true' ]; then
                    echo "PR #${PR_NUMBER} opened as a draft: the review will run when it is marked ready for review."
                  else
                    REASON='pr_opened'
                    RUN=true
                  fi
                  ;;
              esac

              # Automatic triggers only: dependency bumps are not worth a
              # review, but the label still forces one when needed. Exact
              # logins only, a user named e.g. "dependabot-fan" is not a bot.
              if [ "$RUN" = true ] && [ "$REASON" != 'label' ]; then
                case "$EVENT_PR_AUTHOR" in
                  'dependabot[bot]' | 'renovate[bot]')
                    echo "PR #${PR_NUMBER} opened by ${EVENT_PR_AUTHOR}: skipping the automatic review."
                    RUN=false
                    ;;
                esac
              fi
              ;;

            issue_comment)
              PR_NUMBER="$ISSUE_NUMBER"

              # The command must start its own line, so quoting someone else
              # ("> /cursor review") never triggers a new review. Trailing
              # text on the same line is allowed and ignored.
              if printf '%s\n' "$COMMENT_BODY" \
                | grep -qiE '^[[:space:]]*/cursor([[:space:]]|-)+review([[:space:]]|$)'; then
                # Anyone who can already influence the PR content may ask for
                # a review: its author, and anyone with a write-ish
                # relationship to the repository.
                if [ "$COMMENT_AUTHOR" = "$ISSUE_AUTHOR" ]; then
                  REASON='comment'
                  RUN=true
                else
                  case "$COMMENT_ASSOCIATION" in
                    OWNER | MEMBER | COLLABORATOR)
                      REASON='comment'
                      RUN=true
                      ;;
                    *)
                      echo "::warning::${COMMENT_AUTHOR} (${COMMENT_ASSOCIATION}) is not allowed to request a Cursor review on PR #${PR_NUMBER}."
                      react '-1'
                      ;;
                  esac
                fi

                if [ "$RUN" = true ]; then
                  echo "Cursor review requested by ${COMMENT_AUTHOR} on PR #${PR_NUMBER}."
                  react 'eyes'
                fi
              else
                echo "Comment does not contain the /cursor review command, skipping."
              fi
              ;;
          esac

          if [ "$RUN" = true ]; then
            PR_NUMBER=$(echo "$PR_NUMBER" | tr -d '[:space:]')
            case "$PR_NUMBER" in
              '' | *[!0-9]*)
                echo "::error::Invalid PR number '$PR_NUMBER'"
                exit 1
                ;;
            esac
          fi

          {
            echo "run=${RUN}"
            echo "reason=${REASON}"
            echo "number=${PR_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        if: steps.gate.outputs.run == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::Missing secret CURSOR_AUTOMATION_WEBHOOK_URL"
            exit 1
          fi
          if [ -z "$WEBHOOK_TOKEN" ]; then
            echo "::error::Missing secret CURSOR_AUTOMATION_WEBHOOK_TOKEN"
            exit 1
          fi

      - name: Fetch PR metadata and call Cursor webhook
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.number }}
          TRIGGER_SOURCE: ${{ github.event_name }}
          TRIGGER_REASON: ${{ steps.gate.outputs.reason }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          WEBHOOK_URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail

          # REST payload is stable for fork and same-repo PRs.
          PR_JSON=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")

          if [ "$TRIGGER_REASON" = 'label' ]; then
            TRIGGER_LABEL='needs:cursor-review'
          else
            TRIGGER_LABEL=''
          fi

          PAYLOAD=$(jq -n \
            --argjson pr "$PR_JSON" \
            --arg repo "$GH_REPO" \
            --arg trigger_source "$TRIGGER_SOURCE" \
            --arg trigger_reason "$TRIGGER_REASON" \
            --arg label "$TRIGGER_LABEL" \
            --arg requested_by "$COMMENT_AUTHOR" \
            --arg comment_url "$COMMENT_URL" \
            '{
              pr_number: $pr.number,
              pr_url: $pr.html_url,
              repo: $repo,
              title: $pr.title,
              body: ($pr.body // ""),
              state: $pr.state,
              base_ref: $pr.base.ref,
              head_ref: $pr.head.ref,
              head_sha: $pr.head.sha,
              is_fork: ($pr.head.repo.full_name != $repo),
              author: $pr.user.login,
              head_repository: ($pr.head.repo.full_name // $repo),
              trigger_source: $trigger_source,
              trigger_reason: $trigger_reason,
              requested_by: $requested_by,
              comment_url: $comment_url,
              label: $label
            }')

          echo "Triggering Cursor automation for PR #${PR_NUMBER} (source=${TRIGGER_SOURCE}, reason=${TRIGGER_REASON})"
          echo "$PAYLOAD" | jq '{pr_number, pr_url, repo, title, head_ref, head_sha, is_fork, author, head_repository, trigger_source, trigger_reason, requested_by, label}'

          # Response body is only printed on failure: Actions logs are public
          # on this repo, and Cursor error payloads may include internal ids.
          HTTP_CODE=$(curl -sS -o /tmp/cursor-webhook-response.txt -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer ${WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Cursor webhook HTTP status: ${HTTP_CODE}"

          case "$HTTP_CODE" in
            2*)
              echo "Cursor automation triggered successfully."
              if [ -n "${COMMENT_ID}" ]; then
                gh api --silent -X POST \
                  "repos/${GH_REPO}/issues/comments/${COMMENT_ID}/reactions" \
                  -f 'content=rocket' || echo "::warning::Could not react to comment ${COMMENT_ID}"
              fi
              ;;
            *)
              echo "::error::Cursor webhook failed with HTTP ${HTTP_CODE}"
              head -c 2000 /tmp/cursor-webhook-response.txt
              echo
              exit 1
              ;;
          esac
