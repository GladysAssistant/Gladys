name: Build Gladys dev images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker Tag to build'
        required: true
        default: 'dev'
      platforms:
        description: 'Docker platform to build'
        required: true
        default: 'linux/amd64,linux/arm64/v8'

jobs:
  build-front:
    name: Front build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 💽 Setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version-file: 'front/package.json'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: 📦 Install NPM front packages
        working-directory: ./front
        run: |
          npm ci
      - name: 🏗️ Build front
        working-directory: ./front
        run: |
          npm run build
      - name: ↗️ Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: static
          path: front/build
  docker:
    needs: build-front
    name: Docker magic !
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    # The deployment secrets live in the `production` environment, which only
    # jobs running on master or on a v* tag can read (see .github/MAINTAINERS.md).
    environment: production
    env:
      DOCKERHUB_USER: ${{secrets.DOCKERHUB_USER}}
      DOCKERHUB_PASSWORD: ${{secrets.DOCKERHUB_PASSWORD}}
      # The image name is not a secret: an environment variable of `production`.
      DOCKERHUB_REPO: ${{vars.DOCKERHUB_REPO}}
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 🐳 Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.DOCKERHUB_REPO }}
          labels: |
            org.opencontainers.image.title=Gladys Assistant Preprod Image
      - name: 💽 Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: 🐳 Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: latest
      - name: ↙️ Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: static
          path: static
      - name: 🔑 Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: 🐳 Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ./docker/Dockerfile.buildx
          platforms: ${{ github.event.inputs.platforms }}
          push: true
          pull: true
          tags: ${{ vars.DOCKERHUB_REPO }}:${{ github.event.inputs.tag }}
          # No GLADYS_OFFICIAL_RELEASE_IMAGE build arg on purpose: dev images
          # must not count as production installations (no Gladys Plus
          # version check), only the release workflow sets it.
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_REPO }}:${{ github.event.inputs.tag }}
          cache-to: type=inline
