name: Build and publish apidoc documentation

on:
  # Started by the push of the release tag; workflow_dispatch stays for
  # re-running a failed build on an existing tag.
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deployment secrets live in the `production` environment, which only
    # jobs running on master or on a v* tag can read (see .github/MAINTAINERS.md).
    environment: production
    name: Build and publish apidoc documentation
    steps:
      - uses: actions/checkout@v3
      - name: 💽 Setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version-file: './package.json'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: 📦 Install dependencies
        run: |
          npm ci
      - name: 🏗️ Build apidoc
        run: |
          npm run generate-apidoc
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PUBLISH_TO_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./apidoc --project-name=gladysassistant-apidoc --branch=main
