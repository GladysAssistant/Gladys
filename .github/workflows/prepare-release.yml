name: Prepare release (reusable)

# Bumps the version on a `release/vX.Y.Z` branch, ready for a human to open
# the release pull request. This workflow is not run directly: it is called
# by the two entry points of the Actions tab, which decide who may start it.
#
#   prepare-release-patch.yml         patch release, any member with write
#   prepare-release-minor-major.yml   minor/major release, maintainers only
#
# See .github/MAINTAINERS.md for the release process.
on:
  workflow_call:
    inputs:
      release_type:
        description: 'Type of version bump: patch, minor or major'
        required: true
        type: string

jobs:
  prepare-release:
    name: Bump version on a release branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛑 Ensure workflow runs on master
        if: github.ref != 'refs/heads/master'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::This workflow can only be run on master, got ${REF_NAME}."
          exit 1
      - name: 🛑 Ensure the release type is valid
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          case "${RELEASE_TYPE}" in
            patch | minor | major) ;;
            *)
              echo "::error::Unknown release type '${RELEASE_TYPE}', expected patch, minor or major."
              exit 1
              ;;
          esac
      - name: ⬇️ Checkout Gladys code
        uses: actions/checkout@v4
        with:
          # Always release from the current tip of master, not from the commit
          # master pointed at when the workflow was dispatched.
          ref: master
          fetch-depth: 0
      - name: 💽 Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version-file: './package.json'
      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 🔖 Bump version on a release branch
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm version "${RELEASE_TYPE}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists, master may not have been released yet."
            exit 1
          fi
          BRANCH="release/${TAG}"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "::error::Branch ${BRANCH} already exists, from an abandoned release."
            echo "::error::Reuse its pull request, or delete the branch and run this workflow again."
            exit 1
          fi
          git switch -c "${BRANCH}"
          git add package.json package-lock.json
          # Version-only commit message, as every release commit before it.
          git commit -m "${VERSION}"
          git push origin "${BRANCH}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"
      - name: 📝 Job summary
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo "### 📦 Release ${TAG} ready for review"
            echo ""
            echo "- Bump type: \`${RELEASE_TYPE}\`"
            echo "- Branch: [\`${BRANCH}\`](${REPO_URL}/tree/${BRANCH})"
            echo ""
            echo "**[👉 Open the release pull request](${REPO_URL}/compare/master...${BRANCH}?expand=1)**"
            echo ""
            echo "The pull request has to be opened by a human: GitHub does not run the"
            echo "required checks on a pull request opened by the \`GITHUB_TOKEN\`, so an"
            echo "automatically opened one would stay blocked on them forever."
            echo ""
            echo "The author of the pull request cannot approve it: a member of the"
            echo "release team or a maintainer other than the author has to (see"
            echo ".github/CODEOWNERS)."
            echo ""
            echo "Once it is merged, the \`Create release tag\` workflow tags \`${TAG}\` on"
            echo "master and starts the production images, demo website and apidoc builds."
          } >> "$GITHUB_STEP_SUMMARY"
